<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentix Chat UI</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    #container { display: flex; max-width: 900px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; }
    #sidebar { width: 200px; background: #f0f0f0; border-right: 1px solid #eee; padding: 16px 0; border-radius: 8px 0 0 8px; }
    #sessionList { list-style: none; padding: 0; margin: 0; }
    #sessionList li { padding: 8px 16px; cursor: pointer; border-bottom: 1px solid #eee; }
    #sessionList li.active { background: #e3eaff; font-weight: bold; }
    #main { flex: 1; padding: 24px; }
    .msg { margin: 8px 0; }
    .msg.user { text-align: right; color: #1976d2; }
    .msg.agent { text-align: left; color: #333; }
    #inputRow { display: flex; margin-top: 16px; }
    #message { flex: 1; padding: 8px; font-size: 1em; }
    #send { padding: 8px 16px; font-size: 1em; }
  </style>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <button id="newSession" type="button" style="width:90%;margin:0 5% 12px 5%;">New Session</button>
      <ul id="sessionList"></ul>
    </div>
    <div id="main">
      <div id="sessionRow" style="display:flex;align-items:center;margin-bottom:12px;gap:8px;">
        <span>Session:</span>
        <input id="sessionId" style="flex:1;padding:4px;" readonly />
      </div>
      <div id="messages"></div>
      <form id="inputRow">
        <input id="message" autocomplete="off" placeholder="Type your message..." />
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </div>
  <script>
    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('inputRow');
    const input = document.getElementById('message');
    const sessionInput = document.getElementById('sessionId');
    const newSessionBtn = document.getElementById('newSession');
    const sessionListUl = document.getElementById('sessionList');
    let sessionId = localStorage.getItem('agentix-session-id') || generateUUID();
    sessionInput.value = sessionId;
    localStorage.setItem('agentix-session-id', sessionId);

    function generateUUID() {
      // Simple UUID v4
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    async function fetchSessions() {
      try {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        return data.sessions || [];
      } catch {
        return [];
      }
    }

    async function loadSessionList() {
      const sessions = await fetchSessions();
      sessionListUl.innerHTML = '';
      sessions.forEach(sid => {
        const li = document.createElement('li');
        li.textContent = sid;
        if (sid === sessionId) li.className = 'active';
        li.onclick = () => {
          sessionId = sid;
          sessionInput.value = sessionId;
          localStorage.setItem('agentix-session-id', sessionId);
          highlightSession();
          loadSessionMessages();
        };
        sessionListUl.appendChild(li);
      });
    }

    function highlightSession() {
      Array.from(sessionListUl.children).forEach(li => {
        li.className = li.textContent === sessionId ? 'active' : '';
      });
    }

    newSessionBtn.onclick = () => {
      sessionId = generateUUID();
      sessionInput.value = sessionId;
      localStorage.setItem('agentix-session-id', sessionId);
      addMsg('New session started.', 'agent');
      loadSessionList();
      messagesDiv.innerHTML = '';
    };

    function addMsg(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function loadSessionMessages() {
      messagesDiv.innerHTML = '';
      try {
        const res = await fetch(`/api/session/${sessionId}`);
        if (!res.ok) return;
        const data = await res.json();
        (data.messages || []).forEach(msg => {
          addMsg(msg.content, msg.role === 'user' ? 'user' : 'agent');
        });
      } catch {}
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      addMsg('...', 'agent');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId })
        });
        const data = await res.json();
        messagesDiv.lastChild.textContent = data.response || data.error || 'Error';
        loadSessionList(); // update session list in case new session file created
      } catch {
        messagesDiv.lastChild.textContent = 'Network error';
      }
    };

    // Initial load
    loadSessionList();
    loadSessionMessages();
  </script>
</body>
</html>
