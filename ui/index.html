<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentix Chat UI</title>
  <style>
    body { font-family: sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
    #chat { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 24px; }
    .msg { margin: 8px 0; }
    .msg.user { text-align: right; color: #1976d2; }
    .msg.agent { text-align: left; color: #333; }
    #inputRow { display: flex; margin-top: 16px; }
    #message { flex: 1; padding: 8px; font-size: 1em; }
    #send { padding: 8px 16px; font-size: 1em; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <form id="inputRow">
      <input id="message" autocomplete="off" placeholder="Type your message..." />
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script>
    const messagesDiv = document.getElementById('messages');
    const form = document.getElementById('inputRow');
    const input = document.getElementById('message');

    function addMsg(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      addMsg('...', 'agent');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        messagesDiv.lastChild.textContent = data.response || data.error || 'Error';
      } catch {
        messagesDiv.lastChild.textContent = 'Network error';
      }
    };
  </script>
</body>
</html>
